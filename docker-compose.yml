# TicketStar: todo nuestro sistema corriendo en contenedores separados.
#
#   docker compose up -d --build     levanta todo
#   docker compose ps                muestra qué está corriendo
#   docker compose stop eventos      apaga un solo servicio (el resto sigue)
#
# El sitio de prueba del cliente NO está acá: corre en su propio compose
# (clientes-demo/teatro-avenida), como si fuera el sistema de otra empresa.

name: ticketstar

services:
  # Lo único que se ve desde afuera. Resuelve el cliente por el subdominio.
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "${PUERTO_GATEWAY:-80}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      interna: {}
      publica:
        # Con estos nombres lo encuentran los sistemas de los clientes
        aliases:
          - teatro-avenida.ticketstar.localhost
          - club-atletico.ticketstar.localhost
    restart: unless-stopped

  # Cartelera de cada cliente: eventos, funciones y cómo es cada sala.
  eventos:
    build: ./servicios/eventos
    environment:
      DATABASE_URL: postgresql://ticketstar:ticketstar@postgres:5432/ticketstar
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna
    restart: unless-stopped

  # La compra: sesiones, reserva de butacas, órdenes y checkout.
  # Le pregunta a eventos por REST y deja avisos en RabbitMQ.
  ordenes:
    build: ./servicios/ordenes
    environment:
      DATABASE_URL: postgresql://ticketstar:ticketstar@postgres:5432/ticketstar
      URL_PUBLICA: "http://{cliente}.ticketstar.localhost:${PUERTO_GATEWAY:-80}"
      EVENTOS_URL: http://eventos:8000
      RABBITMQ_URL: amqp://ticketstar:ticketstar@rabbitmq:5672/
      # Cuánto dura una reserva sin pagar antes de soltar las butacas (10 minutos)
      SEGUNDOS_RESERVA: "${SEGUNDOS_RESERVA:-600}"
      # Solo para la demo de concurrencia (ver pruebas/README.md). Normalmente en 0.
      RESERVA_SIN_CONTROL: "${RESERVA_SIN_CONTROL:-0}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna
    restart: unless-stopped

  # Escucha la cola y manda los mails. No tiene API ni puertos.
  notificaciones:
    build: ./servicios/notificaciones
    environment:
      DATABASE_URL: postgresql://ticketstar:ticketstar@postgres:5432/ticketstar
      RABBITMQ_URL: amqp://ticketstar:ticketstar@rabbitmq:5672/
      SMTP_HOST: mail
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interna
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticketstar
      POSTGRES_PASSWORD: ticketstar
      POSTGRES_DB: ticketstar
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketstar -d ticketstar"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - interna
    restart: unless-stopped

  # La cola de mensajes entre nuestros servicios. El puerto 15672 es la consola
  # web para mirar las colas (usuario y clave: ticketstar). Solo se abre en esta
  # máquina (127.0.0.1) y no es una entrada al sistema.
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ticketstar
      RABBITMQ_DEFAULT_PASS: ticketstar
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - datos-rabbitmq:/var/lib/rabbitmq
    networks:
      - interna
    restart: unless-stopped

  # Casilla de mail de prueba (Mailpit). Hace de "servidor de mail de afuera":
  # recibe lo que manda notificaciones y lo muestra en http://localhost:8025.
  # No es parte de nuestro sistema, en producción iría un servidor de mail real.
  mail:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - interna
    restart: unless-stopped

networks:
  # Red privada: acá se hablan nuestros servicios. Desde afuera no se ve.
  interna: {}
  # Red "pública": la usan los sistemas de los clientes para llegar al gateway.
  publica:
    name: ticketstar-publica

volumes:
  datos-postgres: {}
  datos-rabbitmq: {}
