# Gateway de TicketStar (nginx).
#
# Es lo único del sistema que se publica hacia afuera. Por el subdominio sabe de
# qué cliente es cada pedido (teatro-avenida.ticketstar.localhost -> teatro-avenida)
# y se lo pasa al servicio que corresponde en el header X-Cliente.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # DNS interno de Docker. Buscamos cada servicio por nombre en cada pedido, y no
    # una sola vez al arrancar: así el gateway levanta aunque algún servicio esté
    # apagado, y lo vuelve a encontrar cuando se prende.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Clientes dados de alta. Por ahora es una lista fija; más adelante sale de la base.
    map $cliente $cliente_valido {
        default         0;
        teatro-avenida  1;
        club-atletico   1;
    }

    log_format ticketstar '$time_local $status "$request" cliente=$cliente '
                          'servicio=$upstream_addr tiempo=${request_time}s';
    access_log /dev/stdout ticketstar;
    error_log  /dev/stderr warn;

    default_type  application/json;
    charset       utf-8;
    charset_types application/json;

    proxy_connect_timeout 2s;
    proxy_read_timeout    10s;

    # --- Pedidos sin subdominio de cliente (por ejemplo http://localhost) --------
    server {
        listen 80 default_server;
        server_name _;

        location = / {
            return 200 '{"mensaje": "Esto es TicketStar. Entrá por el subdominio de un cliente, por ejemplo http://teatro-avenida.ticketstar.localhost/v1/eventos"}';
        }

        # Estado de cada nodo, para ver rápido qué está andando
        location = /estado/gateway {
            return 200 '{"servicio": "gateway", "estado": "ok"}';
        }
        location = /estado/eventos {
            set $destino http://eventos:8000/salud;
            proxy_pass $destino;
        }
        location = /estado/ordenes {
            set $destino http://ordenes:8000/salud;
            proxy_pass $destino;
        }

        location / {
            return 404 '{"detail": "No hay ningún cliente con ese subdominio"}';
        }

        error_page 502 503 504 = @servicio_caido;
        location @servicio_caido {
            return 503 '{"detail": "El servicio no está disponible en este momento"}';
        }
    }

    # --- Pedidos de un cliente: <cliente>.ticketstar.localhost -------------------
    server {
        listen 80;
        server_name ~^(?<cliente>[a-z0-9-]+)\.ticketstar\.localhost$;

        if ($cliente_valido = 0) {
            return 404 '{"detail": "No hay ningún cliente con ese subdominio"}';
        }

        # El cliente lo ponemos nosotros: si alguien manda su propio X-Cliente, acá se pisa
        proxy_set_header X-Cliente       $cliente;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location /v1/eventos {
            set $destino http://eventos:8000;
            proxy_pass $destino;
        }

        location /v1/sesiones {
            set $destino http://ordenes:8000;
            proxy_pass $destino;
        }

        location /checkout/ {
            set $destino http://ordenes:8000;
            proxy_pass $destino;
        }

        location / {
            return 404 '{"detail": "Esa ruta no existe"}';
        }

        error_page 502 503 504 = @servicio_caido;
        location @servicio_caido {
            return 503 '{"detail": "El servicio no está disponible en este momento"}';
        }
    }
}
